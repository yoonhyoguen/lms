spring:
  application:
    name: lms

  # H2 파일 DB: 프로젝트 폴더의 data/lmsdb.mv.db 에 저장 (재시작해도 데이터 유지)
  #   처음부터 다시 하려면 서버를 끄고 data 폴더를 지운다
  datasource:
    url: jdbc:h2:file:./data/lmsdb
    username: sa
    password:

  # H2 콘솔: 배포(인터넷 공개) 시 누구나 DB 를 볼 수 있으므로 기본은 꺼 둔다.
  #   내 PC 에서 DB 를 보고 싶을 때만: 실행 옵션에 --spring.h2.console.enabled=true
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update      # 없는 테이블/칸만 추가, 기존 데이터는 유지
    show-sql: true          # 실행되는 SQL 을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true    # SQL 을 줄바꿈해서 보기 좋게
    open-in-view: true      # 기본값을 명시 (경고 메시지 제거)
    defer-datasource-initialization: true # 테이블을 만든 "다음에" data.sql 을 실행

  # 테스트 데이터 src/main/resources/data.sql 을 켤 때마다 실행 (이미 있는 데이터는 건너뜀)
  sql:
    init:
      mode: always
      encoding: UTF-8

  # 파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB     # 파일 1개 최대
      max-request-size: 11MB  # 요청 전체 최대 (파일 + 폼 값)

server:
  # 포트: 실행 옵션(--server.port) > SERVER_PORT 환경변수 > PORT 환경변수 > 기본 8080
  port: ${PORT:8080}
  # 배포 시스템의 서브도메인(프록시) 뒤에서 실행될 때, 원래 주소(X-Forwarded-*)로 리다이렉트하도록
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1 # 큰 파일도 끝까지 받은 뒤 "10MB 초과" 알림을 보여주기 위함 (기본값이면 연결이 끊김)

# 우리 앱 설정: 업로드 파일 저장 폴더 (프로젝트 폴더 기준)
app:
  upload-dir: ./uploads
