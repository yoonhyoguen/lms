<!DOCTYPE html>
<!--
  403, 404 외의 모든 오류 (400 잘못된 요청, 500 서버 오류 등) 공통 화면.
  서버 오류 중에도 안전하게 그려지도록 layout(사이드바) 없이 독립 페이지로 만든다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 - LMS</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body class="bg-gray-100">

<div class="container">
    <div class="text-center mt-5 pt-5">
        <div class="error mx-auto" th:attr="data-text=${status}" th:text="${status}">500</div>
        <p class="lead text-gray-800 mb-4"
           th:text="${status != null and status >= 500} ? '일시적인 서버 오류가 발생했습니다' : '잘못된 요청입니다'">오류</p>
        <p class="text-gray-500 mb-4">주소를 확인하거나 잠시 후 다시 시도해 주세요.</p>
        <a th:href="@{/}">&larr; 대시보드로 돌아가기</a>
    </div>
</div>

</body>
</html>
