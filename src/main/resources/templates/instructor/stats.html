<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>통계</title>
</head>
<body>

<div layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">통계 대시보드</h1>

        <!-- 강좌 선택: 바꾸면 바로 이동 -->
        <form th:if="${view}" th:action="@{/instructor/stats}" method="get" class="form-inline">
            <select name="courseId" class="form-control form-control-sm" onchange="this.form.submit()">
                <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"
                        th:selected="${c.id == view.course.id}">강좌</option>
            </select>
        </form>
    </div>

    <!-- 강좌가 없을 때 -->
    <div th:unless="${view}" class="card shadow mb-4">
        <div class="card-body text-center text-gray-500 py-5">
            통계를 볼 강좌가 없습니다. <a th:href="@{/instructor/courses/new}">강좌를 개설</a>하세요.
        </div>
    </div>

    <th:block th:if="${view}">

        <!-- 요약 카드 -->
        <div class="row">
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card border-left-primary shadow h-100 py-2"><div class="card-body">
                    <div class="row no-gutters align-items-center"><div class="col mr-2">
                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">수강생</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${view.studentCount} + '명'">0명</div>
                    </div><div class="col-auto"><i class="fas fa-users fa-2x text-gray-300"></i></div></div>
                </div></div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card border-left-info shadow h-100 py-2"><div class="card-body">
                    <div class="row no-gutters align-items-center"><div class="col mr-2">
                        <div class="text-xs font-weight-bold text-info text-uppercase mb-1">과제</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${view.assignmentCount()} + '개'">0개</div>
                    </div><div class="col-auto"><i class="fas fa-tasks fa-2x text-gray-300"></i></div></div>
                </div></div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card border-left-success shadow h-100 py-2"><div class="card-body">
                    <div class="row no-gutters align-items-center"><div class="col mr-2">
                        <div class="text-xs font-weight-bold text-success text-uppercase mb-1">전체 제출률</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${view.overallSubmissionRate()} + '%'">0%</div>
                        <div class="progress progress-sm mt-2">
                            <div class="progress-bar bg-success" role="progressbar"
                                 th:style="'width: ' + ${view.overallSubmissionRate()} + '%'"></div>
                        </div>
                    </div><div class="col-auto"><i class="fas fa-clipboard-check fa-2x text-gray-300"></i></div></div>
                </div></div>
            </div>
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card border-left-warning shadow h-100 py-2"><div class="card-body">
                    <div class="row no-gutters align-items-center"><div class="col mr-2">
                        <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">평균 점수 (100점 환산)</div>
                        <div class="h5 mb-0 font-weight-bold text-gray-800"
                             th:text="${view.overallAveragePercent() != null} ? ${#numbers.formatDecimal(view.overallAveragePercent(), 1, 1)} + '점' : '채점 전'">-</div>
                    </div><div class="col-auto"><i class="fas fa-star fa-2x text-gray-300"></i></div></div>
                </div></div>
            </div>
        </div>

        <p class="small text-gray-500 mt-n2 mb-4">
            * 제출률과 미제출자는 아직 시작하지 않은(예정) 과제를 빼고 계산합니다.
        </p>

        <!-- 차트 2개 -->
        <div class="row" th:unless="${view.rows.isEmpty()}">
            <div class="col-lg-6 mb-4">
                <div class="card shadow h-100">
                    <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">과제별 제출률 (%)</h6></div>
                    <div class="card-body"><div style="height: 300px;"><canvas id="rateChart"></canvas></div></div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="card shadow h-100">
                    <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">과제별 평균 점수 (100점 환산)</h6></div>
                    <div class="card-body"><div style="height: 300px;"><canvas id="scoreChart"></canvas></div></div>
                </div>
            </div>
        </div>

        <div th:if="${view.rows.isEmpty()}" class="card shadow mb-4">
            <div class="card-body text-center text-gray-500 py-4">이 강좌에는 아직 과제가 없습니다.</div>
        </div>

        <!-- 과제별 미제출자 -->
        <div class="card shadow mb-4" th:unless="${view.rows.isEmpty()}">
            <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-danger">과제별 미제출자</h6></div>
            <div class="card-body">
                <p th:if="${view.rowsWithNotSubmitted().isEmpty()}" class="text-center text-gray-500 my-2">
                    미제출자가 없습니다. 👍
                </p>
                <div th:each="row : ${view.rowsWithNotSubmitted()}" class="mb-3">
                    <div class="mb-1">
                        <a class="font-weight-bold"
                           th:href="@{/instructor/assignments/{id}/submissions(id=${row.assignment.id})}"
                           th:text="${row.assignment.title}">과제</a>
                        <span class="badge" th:classappend="${row.assignment.status.badgeClass}"
                              th:text="${row.assignment.status.label}">진행중</span>
                        <span class="small text-gray-500"
                              th:text="${row.notSubmittedStudents.size()} + '명 / ' + ${row.studentCount} + '명'">2명 / 10명</span>
                    </div>
                    <span th:each="student : ${row.notSubmittedStudents}"
                          class="badge badge-light border mr-1 mb-1 p-2"
                          th:text="${student.name} + ' (' + ${student.studentNo} + ')'">홍길동 (2026001)</span>
                </div>
            </div>
        </div>

    </th:block>

</div>

<!-- Chart.js 2.9 (SB Admin 2 내장) -->
<th:block layout:fragment="script">
    <script th:src="@{/vendor/chart.js/Chart.min.js}"></script>
    <!-- th:inline="javascript": 서버 값을 JS 로 안전하게 넘김 (주석 안 값은 Thymeleaf 가 치환) -->
    <script th:inline="javascript">
        const labels = /*[[${chartLabels}]]*/ [];
        const rates = /*[[${chartRates}]]*/ [];
        const averages = /*[[${chartAverages}]]*/ [];

        function barChart(canvasId, data, color, unit) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !labels || labels.length === 0) {
                return;
            }
            new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{data: data, backgroundColor: color, maxBarThickness: 40}]
                },
                options: {
                    maintainAspectRatio: false,
                    legend: {display: false},
                    scales: {
                        yAxes: [{ticks: {beginAtZero: true, max: 100, callback: v => v + unit}}]
                    },
                    tooltips: {
                        callbacks: {label: item => (item.yLabel === null ? '채점 전' : item.yLabel + unit)}
                    }
                }
            });
        }

        barChart('rateChart', rates, '#4e73df', '%');   // SB Admin 2 primary
        barChart('scoreChart', averages, '#1cc88a', '점'); // SB Admin 2 success
    </script>
</th:block>

</body>
</html>
