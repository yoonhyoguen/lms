<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>강좌 상세</title>
</head>
<body>

<div layout:fragment="content">

    <a th:href="@{/instructor/courses}" class="small">&larr; 내 강좌</a>

    <!-- 강좌 정보 (위쪽 색 줄 = 카드와 같은 강좌 색) -->
    <div class="card shadow my-3" th:style="'border-top: 6px solid ' + ${course.color}">
        <div class="card-body d-sm-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 text-gray-800 mb-1" th:text="${course.title}">강좌명</h1>
                <p class="text-gray-600 mb-2"
                   th:text="${course.description != null and !#strings.isEmpty(course.description)} ? ${course.description} : '설명 없음'">설명</p>
                <a th:href="@{/instructor/courses/{id}/edit(id=${course.id})}" class="btn btn-outline-primary btn-sm">
                    <i class="fas fa-pen fa-sm"></i> 강좌 수정
                </a>
            </div>
            <div class="text-sm-right mt-3 mt-sm-0">
                <div class="text-xs font-weight-bold text-uppercase text-gray-500">참여코드</div>
                <div class="h3 mb-1 font-weight-bold text-primary" style="letter-spacing: 3px;"
                     th:text="${course.joinCode}">ABCD2345</div>
                <!-- 참여코드 재발급 (POST) -->
                <form th:action="@{/instructor/courses/{id}/join-code(id=${course.id})}" method="post"
                      onsubmit="return confirm('참여코드를 새로 발급할까요? 기존 코드로는 더 이상 등록할 수 없습니다. (이미 등록한 학생은 그대로)');">
                    <button type="submit" class="btn btn-link btn-sm p-0">
                        <i class="fas fa-sync-alt fa-sm"></i> 코드 재발급
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- I3 과제 목록 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">
                과제 <span th:text="${#lists.size(assignments)}">0</span>개
            </h6>
            <a th:href="@{/instructor/assignments/new(courseId=${course.id})}" class="btn btn-primary btn-sm">
                <i class="fas fa-plus fa-sm"></i> 과제 등록
            </a>
        </div>
        <div class="card-body">

            <p th:if="${#lists.isEmpty(assignments)}" class="text-center text-gray-500 my-3">
                아직 등록한 과제가 없습니다.
            </p>

            <div class="table-responsive" th:unless="${#lists.isEmpty(assignments)}">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 90px;">상태</th>
                        <th>제목</th>
                        <th>제출 기간</th>
                        <th style="width: 80px;">배점</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="assignment : ${assignments}">
                        <td>
                            <span class="badge" th:classappend="${assignment.status.badgeClass}"
                                  th:text="${assignment.status.label}">진행중</span>
                        </td>
                        <td>
                            <a th:href="@{/instructor/assignments/{id}/edit(id=${assignment.id})}"
                               th:text="${assignment.title}">과제 제목</a>
                            <a th:if="${assignment.hasFile()}" th:href="@{/assignments/{id}/file(id=${assignment.id})}"
                               class="ml-2 small text-gray-600" th:title="${assignment.fileOriginalName}">
                                <i class="fas fa-paperclip"></i> 첨부
                            </a>
                            <a th:href="@{/instructor/assignments/{id}/submissions(id=${assignment.id})}"
                               class="btn btn-outline-primary btn-sm float-right">제출 현황</a>
                        </td>
                        <td class="small"
                            th:text="${#temporals.format(assignment.startAt, 'MM-dd HH:mm')} + ' ~ ' + ${#temporals.format(assignment.endAt, 'MM-dd HH:mm')}">
                            10-14 09:00 ~ 10-20 23:59
                        </td>
                        <td>
                            <span th:text="${assignment.maxScore}">100</span>
                            <!-- 점수 공개 여부 (추가 기능) -->
                            <i th:if="${assignment.scoresPublished}" class="fas fa-eye text-success small ml-1" title="점수 공개됨"></i>
                            <i th:unless="${assignment.scoresPublished}" class="fas fa-eye-slash text-gray-400 small ml-1" title="점수 비공개"></i>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- I2 수강생 목록 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                수강생 <span th:text="${#lists.size(enrollments)}">0</span>명
            </h6>
        </div>
        <div class="card-body">

            <p th:if="${#lists.isEmpty(enrollments)}" class="text-center text-gray-500 my-3">
                아직 등록한 학생이 없습니다. 참여코드를 학생들에게 알려주세요.
            </p>

            <div class="table-responsive" th:unless="${#lists.isEmpty(enrollments)}">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 60px;">No</th>
                        <th>학번</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>등록일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="enrollment, stat : ${enrollments}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${enrollment.student.studentNo}">2026001</td>
                        <td th:text="${enrollment.student.name}">홍길동</td>
                        <td th:text="${enrollment.student.email}">hong@lms.com</td>
                        <td th:text="${#temporals.format(enrollment.enrolledAt, 'yyyy-MM-dd HH:mm')}">2026-10-13</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
