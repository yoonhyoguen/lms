<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>강좌 상세</title>
</head>
<body>

<div layout:fragment="content">

    <a th:href="@{/instructor/courses}" class="small">&larr; 내 강좌</a>

    <!-- 강좌 정보 -->
    <div class="card shadow my-3">
        <div class="card-body d-sm-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 text-gray-800 mb-1" th:text="${course.title}">강좌명</h1>
                <p class="text-gray-600 mb-0"
                   th:text="${course.description != null and !#strings.isEmpty(course.description)} ? ${course.description} : '설명 없음'">설명</p>
            </div>
            <div class="text-sm-right mt-3 mt-sm-0">
                <div class="text-xs font-weight-bold text-uppercase text-gray-500">참여코드</div>
                <div class="h3 mb-0 font-weight-bold text-primary" style="letter-spacing: 3px;"
                     th:text="${course.joinCode}">ABCD2345</div>
            </div>
        </div>
    </div>

    <!-- I2 수강생 목록 -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">
                수강생 <span th:text="${#lists.size(enrollments)}">0</span>명
            </h6>
        </div>
        <div class="card-body">

            <p th:if="${#lists.isEmpty(enrollments)}" class="text-center text-gray-500 my-3">
                아직 등록한 학생이 없습니다. 참여코드를 학생들에게 알려주세요.
            </p>

            <div class="table-responsive" th:unless="${#lists.isEmpty(enrollments)}">
                <table class="table table-bordered table-hover mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 60px;">No</th>
                        <th>학번</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>등록일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="enrollment, stat : ${enrollments}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${enrollment.student.studentNo}">2026001</td>
                        <td th:text="${enrollment.student.name}">홍길동</td>
                        <td th:text="${enrollment.student.email}">hong@lms.com</td>
                        <td th:text="${#temporals.format(enrollment.enrolledAt, 'yyyy-MM-dd HH:mm')}">2026-10-13</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
